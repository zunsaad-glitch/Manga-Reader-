name: Build & Export APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Prepare Keystore & Environment
        env:
          MANGADEX_ID: ${{ secrets.MANGADEX_CLIENT_ID }}
          MANGADEX_SECRET: ${{ secrets.MANGADEX_CLIENT_SECRET }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Ensure ~/.android directory exists
          mkdir -p ~/.android

          # Restore or generate debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f "debug.keystore" ] || [ ! -s "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
          cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true

          # Create .env and .env.example for secrets-gradle-plugin
          CLIENT_ID="${MANGADEX_ID:-dummy}"
          CLIENT_SECRET="${MANGADEX_SECRET:-dummy}"
          API_KEY="${GEMINI_KEY:-AQ.Ab8RN6IyXgkA3sFim_zoXVQ_VzFsSZGEucCE2O6m_k8Lh4PO4g}"

          cat <<EOF > .env
          MANGADEX_CLIENT_ID=${CLIENT_ID}
          MANGADEX_CLIENT_SECRET=${CLIENT_SECRET}
          GEMINI_API_KEY=${API_KEY}
          EOF

          cat <<EOF > .env.example
          MANGADEX_CLIENT_ID=dummy
          MANGADEX_CLIENT_SECRET=dummy
          GEMINI_API_KEY=AQ.Ab8RN6IyXgkA3sFim_zoXVQ_VzFsSZGEucCE2O6m_k8Lh4PO4g
          EOF

          # Generate Gradle wrapper files if needed
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin || true
          chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaApp-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MangaApp-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 30

